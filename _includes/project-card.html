<article class="project-card">
  <div class="project-card-header">
    <h3 class="project-card-title">{{ include.project.name }}</h3>
  </div>

  <p class="project-summary">{{ include.project.description }}</p>
  <p class="project-role"><strong>Role:</strong> {{ include.project.role }}</p>

  {%- if include.project.technologies and include.project.technologies.size > 0 -%}
    <ul class="project-tags">
      {%- for tech in include.project.technologies -%}
        <li>{{ tech }}</li>
      {%- endfor -%}
    </ul>
  {%- endif -%}

  <div class="project-card-footer">
    <a class="button button-view" href="{{ include.project.url | relative_url }}">View Project</a>
  </div>
</article>
